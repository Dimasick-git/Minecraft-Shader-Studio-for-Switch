[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-shader-studio"
version = "0.3.0"
description = "RenderDragon Vulkan material builder and LayeredFS packager for Nintendo Switch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lazurite==0.8.4"
]
license = {text = "MIT"}
authors = [{name = "Dimasick-git"}]
keywords = ["minecraft", "renderdragon", "nintendo-switch", "atmosphere", "layeredfs"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

[project.scripts]
mss = "mss.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
