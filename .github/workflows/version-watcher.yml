name: Version Watcher

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Check for updates
        id: check
        run: |
          python scripts/check_latest.py --update > update_log.txt
          cat update_log.txt
          if grep -q "Matrix updated." update_log.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "2.11015981e+08+Dimasick-git@users.noreply.github.com"
          git config --local user.name "Dimasick-git"
          git add compatibility/matrix.json
          git commit -m "Auto-update: Minecraft/Atmosphere versions detected"
          git push
