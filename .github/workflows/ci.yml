name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
      - name: Compile smoke (fake toolchain)
        run: |
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "-m", "unittest", "tests.test_compile", "-v"])
          sys.exit(r.returncode)
          PY
      - name: Run smoke tests
        run: |
          # Basic validation test
          mss doctor
          mss init "TestProject"
          mss validate TestProject || echo "Validation expected to fail without materials"

  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: |
          cd build && ctest --output-on-failure
